[defaults]
forks = 2000
host_key_checking = False
gathering = smart
fact_caching = memory
collections_paths = ./collections
#callback_whitelist = timer, profile_tasks
deprecation_warnings=false
inject_facts_as_vars=false
#artifacts = False

[ssh_connection]
ssh_args = -C -o ControlMaster=auto -o ControlPersist=600s -o UpdateHostKeys=no -o ConnectTimeout=30
# ansible ssh 插件会先执行 `control_path % dict(directory=...)`，故每个字面量 `%`
# 需写两遍：`%%h` → ssh 收到 `%h` 并按主机/用户展开。写成 `%%%%h` 会让 ssh 收到
# `%%h` 并视作字面量 `%`，所有连接塌缩到同一个 socket（跨账号复用 master）。
control_path = /tmp/panshi-cp/%%h-%%p-%%r
pipelining = True
timeout = 30