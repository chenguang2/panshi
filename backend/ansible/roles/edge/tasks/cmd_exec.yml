---
###################### run cmd_exec ########################
- name: run cmd_exec
  script: "{{ cmd_exec_script_path_name }} {{ cmd_security }} {{ cmd_timeout }} {{ cmd_exec }} {{ cmd_whitelist }}"
  loop: "{{ lookup('ansible.utils.index_of', ips, 'eq', inventory_hostname, wantlist=True) }}"
  register: cmd_output
  changed_when: false
  failed_when: false
  ignore_errors: false
  no_log: false
  tags:
    - cmd_exec_run
###################### gen log ########################
- name: out
  debug:
    msg: "{{ item.stdout_lines }}"
  loop: "{{ cmd_output.results | default([]) }}"
  when:
    - cmd_output is defined
    - cmd_output.results is defined
    - cmd_output.results | length > 0
    - item.stdout_lines is defined
  tags:
    - cmd_exec_run
