---
###################### status: check is-enabled ########################

- name: status - check is-enabled
  command: systemctl is-enabled edge
  register: status_result
  failed_when: false
  changed_when: false
  when: autostart_action == 'status'
  tags:
    - edge_autostart

- name: status - normalize result
  set_fact:
    edge_autostart_state: >-
      {%- set raw = status_result.stdout + ' ' + status_result.stderr -%}
      {%- if 'No such file or directory' in raw -%}not_configured
      {%- elif 'enabled' in raw -%}enabled
      {%- elif 'disabled' in raw -%}disabled
      {%- else -%}unknown{%- endif -%}
  when: autostart_action == 'status'
  tags:
    - edge_autostart

- name: status - report result
  debug:
    msg: "edge_autostart_state={{ edge_autostart_state }} raw={{ status_result.stdout }}"
  when: autostart_action == 'status'
  tags:
    - edge_autostart

###################### enable: write service + enable ########################

- name: enable - write edge.service
  copy:
    content: "{{ edge_service_content }}"
    dest: /etc/systemd/system/edge.service
    owner: root
    group: root
    mode: '0644'
  when: autostart_action == 'enable'
  tags:
    - edge_autostart

- name: enable - daemon-reload
  command: systemctl daemon-reload
  changed_when: false
  when: autostart_action == 'enable'
  tags:
    - edge_autostart

- name: enable - systemctl enable edge
  command: systemctl enable edge
  when: autostart_action == 'enable'
  tags:
    - edge_autostart

###################### disable: unlink only (keep service file) ########################

- name: disable - systemctl disable edge
  command: systemctl disable edge
  failed_when: false
  changed_when: false
  when: autostart_action == 'disable'
  tags:
    - edge_autostart
