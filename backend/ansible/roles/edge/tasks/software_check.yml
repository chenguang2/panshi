---
###################### run software check ########################
- name: run software check
  # software_list 必须经 quote 再拼进远程命令行：未 quote 的元字符
  # （; ` $() 等）会被目标机 shell 解释（服务端另有字符集白名单校验，
  # 此处为纵深防御）。
  script: "{{ software_check_script_path_name }} {{ software_list | quote }}"
  loop: "{{ lookup('ansible.utils.index_of', ips, 'eq', inventory_hostname, wantlist=True) }}"
  register: cmd_output
  changed_when: false
  failed_when: false
  ignore_errors: false
  no_log: false
  tags:
    - software_check_run
###################### gen log ########################
- name: out
  debug:
    msg: "{{ item.stdout_lines }}"
  loop: "{{ cmd_output.results | default([]) }}"
  when:
    - cmd_output is defined
    - cmd_output.results is defined
    - cmd_output.results | length > 0
    - item.stdout_lines is defined
  tags:
    - software_check_run
