features:
  edge_client: true
  edge_import: true
  tools: true
  install_openresty: true
  install_edge: true
  plugin_switches: true
  metrics: true
  edge_env: true
  stream_proxy: true
  ssl_cert: true
  dns_proxy_udp: true
  dns_proxy_http: true
  task_center: true
  database_management: true
  # 数据迁移（迁移/归档导入导出独立权限域，与数据库管理分离）
  db_migration: true
  # 备份与容灾（db_backup 权限对应的功能开关）
  db_backup: true
  edge_autostart: true
  ansible_inventory: true
  clickhouse_config: true
  audit_log: true
  # 中继总开关（敏感：改变节点网络路径，默认关；显式开启后才经区域网关路由）
  # 默认口令守卫（敏感：改变登录/拦截行为，默认关 = 不列出；显式 true 后登录
  # 检测种子默认口令并硬强制改密，热生效免重启。启用前签发的 token 不受拦截，
  # 最长 24h 过期或下次登录收敛）
  force_default_password_change: false
  relay_gateway: true
enabled_plugins:
  - proxy_rewrite
  - response_rewrite
  - traffic_split
  - traffic_limit_count
  - pre_functions
  - functions_pre
  - data_center
  - log_process
  - static_resource
  - traceid
  - monitor
  - dns_upstream
  - redirect
# 品牌信息（branding-configuration）：登录页主品牌/页脚、侧边栏文案与版本徽标、
# 浏览器标签页标题均消费此处配置；mtime 热加载，改完切回页面即生效。
# 未配置整个命名空间或单个 key 时回落内置默认值（= 下方示例值，现状行为）。
branding:
  system_name: 磐石                    # 系统短名：浏览器标签页标题
  brand_name: 磐石 Gateway             # 品牌名：登录页主品牌 + 侧边栏文案
  product_name: Panshi Gateway Admin   # 产品英文全名：登录页页脚前缀
  version: v3.1                        # 版本号：登录页页脚后缀 + 侧边栏徽标
  # system_name: Bedrock                    # 系统短名：浏览器标签页标题
  # brand_name: Bedrock Gateway             # 品牌名：登录页主品牌 + 侧边栏文案
  # product_name: Bedrock Gateway Admin   # 产品英文全名：登录页页脚前缀
  # version: v3.1                        # 版本号：登录页页脚后缀 + 侧边栏徽标  
# 全局规则两入口可用插件清单（与 enabled_plugins 同级；空/未配置 = 不限制，
# 目录全量可选）。后续调整只改本清单，mtime 热加载、免改代码免重启。
global_rule_plugins:
  - traceid
  - monitor
# 插件元数据两添加入口可用插件清单（与 enabled_plugins 同级；空/未配置 = 不限制，
# 目录全量可选）。默认值 = 旧写死字段 enable_metadata=true 的全部插件（现状精确保留：
# 其中 12 个 security 系仍被 enabled_plugins 平台白名单先行裁掉，实际可见集
# data_center + log_process 不变）。旧字段已退役，本清单是唯一事实源。
plugin_metadata_plugins:
  - data_center
  - log_process
# 并发参数：batch_action 为前端批量节点操作并发，max_playbooks 为后端全局
# ansible 并发上限。前端实际并发为 min(batch_action, max_playbooks)，建议两值联动。
concurrency:
  max_playbooks: 5
  batch_action: 5
# 体积上限（static-zip-limit-config）：部署级容量策略，每实例一值，mtime 热加载。
# static_zip_max_mb：静态资源 zip 上限（整数 MB，缺省 32，范围 1–2048）。
# ⚠ 调大它之前必须先调大 nginx 侧上限，否则「上传能过、发布 413」：
#   - 经中继发布腿 → 区域网关 nginx 的 client_max_body_size（当前部署 32m）；
#   - 直连发布腿   → 各 Edge 节点 edge.env 的 client_max_body_size
#                    （实测为注释态时 nginx 默认 1m，超过即直连发布 413）。
# 提示：上限越大，单请求越可能被整体读入后端内存（上传腿按上限做防御读取）。
limits:
  static_zip_max_mb: 132
